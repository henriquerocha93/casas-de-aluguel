<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRC Imóveis - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at center, #1C263A 0%, #0B0F19 100%);
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-logo img {
            max-width: 180px;
            height: auto;
        }
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .login-header p {
            color: var(--text-muted);
            font-size: 14px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }
        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            transition: 0.3s;
        }
        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-muted);
        }
        .remember-me input {
            cursor: pointer;
        }
        .error-message {
            background-color: var(--danger-bg);
            color: var(--danger);
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <img src="hrc_logo_new.png" alt="HRC Imóveis">
        </div>
        <div class="login-header">
            <h1>Bem-vindo de volta</h1>
            <p>Acesse o painel administrativo</p>
        </div>

        <div id="error-alert" class="error-message">
            Usuário ou senha incorretos.
        </div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label">Usuário</label>
                <div class="input-wrapper">
                    <i class='bx bx-user'></i>
                    <input type="text" id="username" placeholder="Seu usuário" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Senha</label>
                <div class="input-wrapper">
                    <i class='bx bx-lock-alt'></i>
                    <input type="password" id="password" placeholder="Sua senha" required>
                </div>
            </div>

            <div class="login-options">
                <label class="remember-me">
                    <input type="checkbox" id="remember-me"> Lembrar-me
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Acessar Sistema <i class='bx bx-right-arrow-alt'></i>
            </button>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
